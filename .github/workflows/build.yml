name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Organize Web Assets
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Capacitor Core and CLI
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Project
        run: |
          npx cap init "Mi Remote" "com.mitv.remote" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure Java 21 and Dependency Resolution
        run: |
          cd android
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          
          # Add conflict resolution strategy to build.gradle
          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy.eachDependency { details ->" >> app/build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {" >> app/build.gradle
          echo "            details.useVersion '1.8.22'" >> app/build.gradle
          echo "        }" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

      - name: Make Gradle Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi-TV-Remote-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
